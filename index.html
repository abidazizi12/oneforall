<style>
:root{--bg:#faf8ff;--sf:#fff;--sf2:#eaedff;--sf3:#f2f3ff;--tx:#131b2e;--tx2:#464555;--ol:#c7c4d8;--bd:#e2e8f0;--p:#3525cd;--pc:#4f46e5;--onp:#fff;--a:#fd761a;--a2:#ffdbca;--m:#6ffbbe;--er:#ba1a1a;--er2:#ffdad6;--dk:#283044;

:root[data-t=dark]{--bg:#0f1424;--sf:#1a2136;--sf2:#262e48;--sf3:#1f2740;--tx:#eef0ff;--tx2:#b9bbd3;--ol:#3a4262;--bd:#2b3452;--p:#c3c0ff;--pc:#c3c0ff;--onp:#0f0069;--a2:#4a2a14;--er2:#4a1f1f;--er:#ffb4ab;--sh:0 4px 16px rgba(0,0,0,.35);--sh2:0 12px 32px rgba(0,0,0,.45);--glow:0 8px 24px rgba(0,0,0,.4)}

.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;flex:none;vertical-align:middle;user-select:none}

.top{display:flex;align-items:center;gap:12px;padding:14px 0}

.top .tt{flex:1;min-width:0}.top h1{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}.top small{font-size:.8rem;color:var(--tx2);font-weight:500;display:block}
.ib{width:48px;height:48px;border-radius:24px;background:var(--sf);border:1px solid var(--bd);flex:none}

.sh{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.sec{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}.sec .ms{color:var(--p)}.sh small{font-size:.7rem;font-weight:600;color:var(--tx2);letter-spacing:.1em}
.big2{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}.sub{font-size:.85rem;color:var(--tx2);margin-top:2px}

.pill.g{background:var(--m);color:#002113}.pill.o{background:var(--a2);color:#5c2400}.pill.r{background:var(--er2);color:var(--er)}
.rec{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.rec::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:12px;padding:8px 22px 8px 8px;border-radius:30px;background:var(--sf);box-shadow:var(--sh);min-height:56px;text-align:left;justify-content:flex-start}

.sq{width:40px;height:40px;border-radius:5px;display:grid;place-items:center;flex:none}

.cover{position:absolute;inset:0;border-radius:28px}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom,0px));width:calc(100% - 40px);max-width:520px;background:var(--dk);color:#fff;border-radius:30px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh2);z-index:5}
.dock .dot{width:10px;height:10px;border-radius:5px;background:var(--a)}.dock b{font-size:.85rem;flex:1;white-space:nowrap;font-weight:600}.dock small{background:rgba(255,255,255,.15);padding:2px 8px;border-radius:10px;font-size:.7rem;margin-left:6px}
.dock button{width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.14);color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.nav div{display:flex;width:100%;max-width:520px;background:var(--sf);border-radius:32px;padding:6px;box-shadow:var(--sh2);border:1px solid var(--bd)}
.nav button{flex:1;height:62px;border-radius:28px;font-weight:600;font-size:.75rem;color:var(--tx2);line-height:1.25;flex-direction:column;gap:2px}
.nav button.on{background:var(--sf2);color:var(--p)}
.btn{width:100%;min-height:56px;border-radius:28px;background:var(--pc);color:#fff;font-weight:700;font-size:1.05rem;box-shadow:var(--glow);padding:0 20px;gap:10px}
.btn:active{background:#4338ca}
.btn.g{background:linear-gradient(90deg,#3525cd 45%,#fd761a);font-size:1.1rem}
.btn.o{background:var(--sf2);color:var(--tx);box-shadow:none;font-weight:600;font-size:.9rem;min-height:52px}
.btn.o .ms{color:var(--p)}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 0}.seg::-webkit-scrollbar{display:none}
.seg.in{background:var(--sf2);border-radius:32px;padding:6px;gap:4px}
.seg button{flex:1 0 auto;min-height:48px;padding:0 18px;border-radius:24px;background:var(--sf2);font-weight:600;font-size:.9rem;white-space:nowrap}
.seg.in button{background:none}
.seg button.on{background:var(--p);color:var(--onp);box-shadow:var(--glow)}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:24px;padding:14px 16px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.sp{justify-content:space-between}.sp>*{flex:none}
.step{display:flex;align-items:center;background:var(--sf2);border-radius:28px;padding:4px;gap:6px}
.step button{width:48px;height:48px;border-radius:24px;background:var(--sf)}.step b{padding:0 8px;color:var(--p);font-size:1.05rem}
.stage{margin-top:14px;border-radius:32px;background:linear-gradient(135deg,var(--sf2),var(--sf) 50%,var(--a2));box-shadow:var(--sh2);padding:22px 14px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.hint{font-size:.75rem;font-weight:600;color:var(--p);background:var(--sf);padding:6px 14px;border-radius:16px;display:inline-flex;align-items:center;gap:6px}
.dice{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;min-height:110px;align-items:center}
.d{width:88px;height:88px;border-radius:24px;background:linear-gradient(145deg,#fff,var(--sf2));box-shadow:var(--sh2),inset 0 -6px 0 var(--sf2);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:16px;gap:2px;place-items:center;font-size:2.2rem;font-weight:800;color:var(--p)}
:root[data-t=dark] .d{background:var(--sf)}
.d:nth-child(odd){transform:rotate(-6deg)}.d:nth-child(even){transform:rotate(6deg)}
.d.n{display:grid;place-items:center;padding:0}.d.big{width:120px;height:120px;border-radius:32px;padding:22px}.d.big.n{font-size:3.2rem}
.d i{width:15px;height:15px;border-radius:50%;background:#475569}.d.o i{background:#c2410c}.d.big i{width:20px;height:20px}
.rolling .d{animation:sh .12s infinite}
@keyframes sh{0%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-6px)}100%{transform:rotate(-8deg)}}
.tot{font-size:1.1rem;font-weight:600;color:var(--tx2);letter-spacing:.04em}.tot b{font-size:3.4rem;font-weight:800;color:var(--p);margin-left:8px;letter-spacing:-.03em;vertical-align:middle}
.hrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.hrow::-webkit-scrollbar{display:none}
.hc{flex:none;background:var(--sf);border-radius:18px;padding:10px 14px;box-shadow:var(--sh);font-size:.75rem;font-weight:700}.hc span{font-weight:500;color:var(--tx2);margin-left:6px}.hc div{margin-top:6px;font-size:1.1rem}.hc em{font-style:normal;background:var(--sf2);color:var(--p);padding:2px 8px;border-radius:8px;font-size:.8rem;margin-right:6px}
.tm{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;text-align:center}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;position:relative}
.team{background:var(--sf);border-radius:26px;box-shadow:var(--sh);padding:16px 10px 14px;text-align:center;border-top:8px solid;display:flex;flex-direction:column;align-items:center;gap:8px}
.nm{display:flex;align-items:center;gap:6px;width:100%;background:var(--sf2);border-radius:16px;height:40px;padding:0 10px}.nm i{width:10px;height:10px;border-radius:50%;flex:none}.nm input{flex:1;min-width:0;background:none;border:0;font-weight:700;font-size:.8rem;text-transform:uppercase;height:100%;padding:0}.nm input:focus{box-shadow:none}.nm .ms{color:var(--tx2)}
.team .sc{font-size:clamp(64px,22vw,96px);font-weight:800;line-height:1;letter-spacing:-.04em}
.team .pm{display:flex;gap:8px;width:100%}.team .pm button{flex:1;height:56px;border-radius:28px;background:var(--sf2)}.team .pm button.pl{color:#fff}
.vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:20px;background:var(--tx);color:var(--bg);font-size:.75rem;font-weight:800;display:grid;place-items:center;z-index:2}
.pts{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}.pts button{min-height:48px;border-radius:24px;background:var(--sf2);font-weight:600;font-size:.85rem}
.match{background:var(--sf);border:1px solid var(--bd);border-radius:26px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.sb{margin:12px 0;background:var(--sf3);border-radius:30px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:6px}
.sb b{font-size:.85rem;font-weight:700;flex:1;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}.sb b:last-child{text-align:right}
.sb .n{background:var(--sf);border-radius:20px;padding:6px 14px;font-size:1.5rem;font-weight:800;color:var(--p);flex:none}
.win{display:flex;justify-content:space-between;align-items:center;background:var(--a2);border-radius:20px;padding:12px 16px;font-weight:600;font-size:.85rem}.win .ms{color:#f59e0b}
.meta{font-size:.78rem;color:var(--tx2);margin:12px 0;display:flex;align-items:center;gap:6px}
.hero{background:linear-gradient(135deg,#3525cd,#4f46e5 60%,#7c6df5);color:#fff;border-radius:32px;padding:22px;box-shadow:var(--sh2);display:flex;gap:14px;align-items:center}
.hero .hi{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}.hero h2{font-size:1.25rem;font-weight:700}.hero p{font-size:.8rem;opacity:.85}
.grp{font-size:.75rem;font-weight:700;color:var(--tx2);letter-spacing:.08em;text-transform:uppercase;margin:24px 4px 10px}
.set{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:72px;justify-content:flex-start}
.set .t{flex:1;min-width:0}.set b{display:block;font-size:1rem;font-weight:600}.set small{font-size:.78rem;color:var(--tx2)}
.set+.set{border-top:1px solid var(--bd)}
.card2{background:var(--sf);border:1px solid var(--bd);border-radius:26px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
.sw{width:56px;height:32px;border-radius:16px;background:var(--sf2);border:1px solid var(--ol);position:relative;flex:none;transition:background .15s}
.sw i{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.on .sw{background:var(--pc);border-color:var(--pc)}.on .sw i{left:26px}
.empty{text-align:center;color:var(--tx2);padding:36px 10px;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:24px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;white-space:nowrap}
#toast.s{opacity:1}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.rolling .d{animation:none}}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
const I=(n,c)=>`<span class="ms ${c||''}">${n}</span>`;
const TOOLS=[
{id:'dadu',n:'Dadu Digital',d:'Lempar acak D6, D12, D20',ic:'casino',bg:'#3525cd',fg:'#fff',tag:'Dadu 3D',ok:1},
{id:'skor',n:'Papan Skor',d:'Catat skor Futsal & Basket',ic:'emoji_events',bg:'#fd761a',fg:'#fff',tag:'2 Tim',ok:1},
{id:'koin',n:'Lempar Koin',d:'Kepala atau Ekor sekejap',ic:'monetization_on',bg:'#ffdbca',fg:'#9d4300',tag:'50:50'},
{id:'nama',n:'Pengacak Nama',d:'Undian & arisan praktis',ic:'shuffle',bg:'#005338',fg:'#fff',tag:'Arisan'},
{id:'roda',n:'Roda Putar',d:'Putar keputusan acak',ic:'incomplete_circle',bg:'#c3c0ff',fg:'#3525cd',tag:'Spiner'},
{id:'timer',n:'Timer & Stopwatch',d:'Hitung mundur presisi',ic:'timer',bg:'#e2e7ff',fg:'#3525cd',tag:'Detik'},
{id:'hitung',n:'Penghitung (Counter)',d:'Tally zikir, antrean & hitung cepat',ic:'exposure_plus_1',bg:'#6ffbbe',fg:'#005338',tag:'Tally',w:1}];
const SPI={Futsal:'sports_soccer',Basket:'sports_basketball',Badminton:'sports_tennis',Voli:'sports_volleyball',Umum:'sports_score'};
const DEF={dark:null,vib:true,snd:true,wake:true,big:false};
let st={fav:[],recent:[],hist:[],set:{...DEF}};
try{const x=JSON.parse(localStorage.getItem('ofa'));if(x)st={...st,...x,set:{...DEF,...x.set}}}catch(e){}
st.recent=st.recent.map(x=>typeof x==='string'?{id:x,t:Date.now()}:x);
const save=()=>{try{localStorage.setItem('ofa',JSON.stringify(st))}catch(e){}};
let view='home',q='',rf='Semua';
let dc={n:2,t:6,vals:[],hist:[],rolling:false};
const SC0={a:0,b:0,fa:0,fb:0,na:'Garuda',nb:'Rajawali',ca:'#3525cd',cb:'#fd761a',sport:'Futsal',t:0,bab:1,run:false};
let sc={...SC0};
let tI=null,wl=null,ac=null,last=0,shakeOn=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';setTimeout(()=>t.className='',1800)}
function vib(p){if(st.set.vib&&navigator.vibrate)navigator.vibrate(p||25)}
function beep(f,d){if(!st.set.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f||520;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.08))}catch(e){}}
function theme(){const d=st.set.dark===null?matchMedia('(prefers-color-scheme:dark)').matches:st.set.dark;const r=document.documentElement;r.dataset.t=d?'dark':'light';r.classList.toggle('big',!!st.set.big)}
function ago(t){const m=Math.round((Date.now()-t)/60000);return m<1?'baru saja':m<60?m+' mnt lalu':m<1440?Math.round(m/60)+' jam lalu':Math.round(m/1440)+' hari lalu'}
function go(v){view=v;if(TOOLS.some(t=>t.id===v&&t.ok)){st.recent=[{id:v,t:Date.now()},...st.recent.filter(x=>x.id!==v)].slice(0,5);save()}
 if(v==='skor')wake();else rel();render();scrollTo(0,0)}
async function wake(){if(st.set.wake&&'wakeLock'in navigator){try{wl=await navigator.wakeLock.request('screen')}catch(e){}}}
function rel(){if(wl){wl.release().catch(()=>{});wl=null}}
function hdr(title,sub,back){return `<div class="top">${back?`<button class="ib pl" data-go="${back}" aria-label="Kembali">${I('arrow_back')}</button>`:''}<img src="icon.svg" alt="One for All"><div class="tt"><h1>${title}</h1>${sub?`<small>${sub}</small>`:''}</div>${back?'':`<button class="ib pl" data-set="vib" aria-label="Getar">${I('vibration')}</button>`}<button class="ib pr" data-go="set" aria-label="Pengaturan">${I('person','s')}</button></div>`}
function nav(){const t=[['home','home','Beranda'],['fav','star','Favorit'],['set','tune','Pengaturan']];
 return `<div class="nav"><div>${t.map(x=>`<button data-go="${x[0]}" class="${view===x[0]?'on':''}">${I(x[1])}${x[2]}</button>`).join('')}</div></div>`}
const sq=(t,c)=>`<span class="sq ${c||''}" style="background:${t.bg};color:${t.fg}">${I(t.ic)}</span>`;
function card(t){const f=st.fav.includes(t.id);
 const star=`<button class="star ${f?'':'off'}" data-fav="${t.id}" aria-label="Favorit">${I('star',f?'f':'')}</button>`;
 const cov=`<button class="cover" data-tool="${t.id}" aria-label="Buka ${t.n}"></button>`;
 if(t.w)return `<div class="card w">${sq(t)}<div><h3>${t.n}</h3><p>${t.d}</p></div><span class="pill g" style="align-self:flex-start;margin-right:40px">${t.tag}</span>${star}${cov}</div>`;
 return `<div class="card" ${t.ok?'':'style="opacity:.85"'}>${star}${sq(t)}<h3>${t.n}</h3><p>${t.d}</p><div class="ft"><span class="pill">${t.ok?t.tag:'Segera hadir'}</span>${I('arrow_forward','s')}</div>${cov}</div>`}
function vHome(){const l=TOOLS.filter(t=>t.n.toLowerCase().includes(q.toLowerCase()));
 const r=st.recent.map(x=>({t:TOOLS.find(y=>y.id===x.id),w:x.t})).filter(x=>x.t);
 const fv=st.fav.map(id=>TOOLS.find(t=>t.id===id)).filter(Boolean);
